# Advisories that cannot be fixed from this repository.
#
# All three are in rustls-webpki 0.101.7, which arrives under minreq 2.14.1,
# which esplora-client 0.12.3 pins. minreq 3.0 carries a current rustls, but
# nothing here can make esplora-client take it, so the fix is an upstream bump
# rather than a change on this side.
#
# Listed one by one on purpose: a new advisory still fails the build. Delete
# these the moment esplora-client moves.
#
# Impact here is narrow but not nothing: all three are certificate validation
# bugs in the TLS client that talks to Esplora. This coordinator already treats
# every backend answer as untrusted -- amounts are checked against the chain,
# signatures against keys computed locally -- so a bad answer is caught rather
# than believed. That is a reason it is survivable, not a reason it is fine.
[advisories]
ignore = [
    "RUSTSEC-2026-0098",  # rustls-webpki: URI name constraints wrongly accepted
    "RUSTSEC-2026-0099",  # rustls-webpki: wildcard name constraints wrongly accepted
    "RUSTSEC-2026-0104",  # rustls-webpki: panic parsing a certificate revocation list

    # libsqlite3-sys 0.28.0 bundles SQLite 3.45, which can hand back stale
    # process memory when it opens a database together with a crafted -wal
    # file. The fix is libsqlite3-sys 0.39 (rusqlite 0.41), and every
    # bdk_chain release through 0.23.4 requires rusqlite ^0.31, so nothing
    # here can take it. The only database this opens is wallet.sqlite in the
    # owner's own wallet directory; someone able to plant files there can
    # already replace the wallet and read the scan key beside it. Delete this
    # when bdk_chain moves to rusqlite 0.41.
    "RUSTSEC-2026-0459",  # libsqlite3-sys: stale memory from a crafted -wal

    # Only in the optional `marmot` feature, which the default build and the
    # signing path never compile: these crates arrive through mdk-core 0.8.0
    # and the MLS stack (openmls, libcrux) it pins. They carry the encrypted
    # messages between two wallets of a shared send, which hold an unsigned
    # transaction that becomes public when it is broadcast, never a key.
    # Delete them when MDK moves to fixed versions.
    "RUSTSEC-2026-0387",  # crypto-bigint 0.5.5: timing variability
    "RUSTSEC-2026-0209",  # libcrux-aesgcm: AAD length not limited
    "RUSTSEC-2026-0211",  # libcrux-aesgcm: tag check not constant time
    "RUSTSEC-2026-0124",  # libcrux-chacha20poly1305: panic on overlong buffer
    "RUSTSEC-2026-0330",  # libcrux-kem: panic on short seed
    "RUSTSEC-2026-0331",  # libcrux-kem: panic on short hybrid key
    "RUSTSEC-2026-0212",  # libcrux-secrets: constant time select on aarch64
    "RUSTSEC-2026-0207",  # libcrux-sha3: incremental SHAKE output
    "RUSTSEC-2026-0208",  # libcrux-sha3: AVX2 SHAKE-256 panic
]
