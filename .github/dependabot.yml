version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # bitcoin, secp256k1 and the bdk crates move together. A bump to one alone
    # usually will not resolve, so they arrive as one pull request.
    groups:
      bitcoin:
        patterns:
          - "bdk*"
          - "bitcoin*"
          - "secp256k1*"
          - "psbt-v2"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
