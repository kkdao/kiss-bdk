[package]
name = "kiss-bdk"
version = "0.1.0"
edition = "2024"
# Verified in CI rather than declared: `cargo check` on exactly this toolchain.
# Edition 2024 needs 1.85, `is_multiple_of` 1.87, and let-chains 1.88.
rust-version = "1.88"
description = "Experimental test-network coordinator for the KISS air-gapped signer"
license = "MIT"
repository = "https://github.com/kkdao/kiss-bdk"
readme = "README.md"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
bdk_esplora = { version = "0.22.2", default-features = false, features = ["std", "blocking-https-rustls"] }
bdk_wallet = { version = "3.1.0", features = ["rusqlite"] }
# BIP-352 receive-side scanning; shares bdk_wallet's bitcoin 0.32.
bdk_sp = { version = "0.2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
minicbor = "2.2"
# Already in the tree via bdk_esplora's blocking backend; reused for faucet calls.
minreq = { version = "2.14", features = ["https-rustls"] }
# BIP-375 silent payment PSBT fields; shares bdk_wallet's bitcoin 0.32.
psbt-v2 = { version = "=0.3.0", features = ["silent-payments", "base64", "std"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.26"
ur = "0.5.0"

[build-dependencies]
cc = "1.3"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa-bindings-macos = "0.2.4"

[dev-dependencies]
serde_json = "1.0"
bdk_wallet = { version = "3.1.0", features = ["test-utils"] }
