[package]
name = "kiss-bdk"
version = "0.1.0"
edition = "2024"
# Verified in CI rather than declared: `cargo check` on exactly this toolchain.
# Edition 2024 needs 1.85, `is_multiple_of` 1.87, and let-chains 1.88.
rust-version = "1.88"
description = "Experimental test-network coordinator for the KISS offline signing device"
license = "MIT"
repository = "https://github.com/kkdao/kiss-bdk"
readme = "README.md"
# `cargo run` keeps meaning the coordinator now that a second binary exists.
default-run = "kiss-bdk"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bdk_esplora = { version = "0.22.2", default-features = false, features = ["std", "blocking-https-native"] }
bdk_wallet = { version = "3.1.0", features = ["rusqlite"] }
# BIP-352 receive-side scanning; shares bdk_wallet's bitcoin 0.32.
bdk_sp = { version = "0.2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
minicbor = "2.2"
# Already in the tree via bdk_esplora's blocking backend; reused for faucet calls.
minreq = { version = "2.14", features = ["https-native"] }
# BIP-375 silent payment PSBT fields; shares bdk_wallet's bitcoin 0.32.
psbt-v2 = { version = "=0.3.0", features = ["silent-payments", "base64", "std"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.26"
ur = "0.5.0"
# Marmot transport (MLS group messaging over nostr). Optional, and only built
# with `--features marmot`, so the default build does not change. The nostr
# crates are the 0.44 line because that is the one MDK 0.8 is built on.
# mdk-sqlite-storage cannot be used: it needs rusqlite 0.37 and bdk_wallet
# links rusqlite 0.31, and only one sqlite may be linked. The MLS state is
# kept in the in-memory stores and saved to a file instead.
mdk-core = { version = "0.8.0", optional = true }
mdk-memory-storage = { version = "0.8.0", optional = true }
mdk-storage-traits = { version = "0.8.0", optional = true }
nostr-relay-builder = { version = "0.44", optional = true }
nostr-sdk = { version = "0.44", optional = true, features = ["nip59"] }
openmls_memory_storage = { version = "0.5", optional = true }
openmls_traits = { version = "0.5", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time"] }

[features]
marmot = [
    "dep:mdk-core",
    "dep:mdk-memory-storage",
    "dep:mdk-storage-traits",
    "dep:nostr-relay-builder",
    "dep:nostr-sdk",
    "dep:openmls_memory_storage",
    "dep:openmls_traits",
    "dep:tokio",
]

[[bin]]
name = "kiss-marmot"
path = "src/bin/kiss-marmot.rs"
required-features = ["marmot"]

[[test]]
name = "marmot_local"
path = "tests/marmot_local.rs"
required-features = ["marmot"]

[build-dependencies]
cc = "1.3"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa-bindings-macos = "0.2.4"

[dev-dependencies]
serde_json = "1.0"
bdk_wallet = { version = "3.1.0", features = ["test-utils"] }
